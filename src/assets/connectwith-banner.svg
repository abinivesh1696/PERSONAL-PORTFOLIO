<svg width="1000" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient blue -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a5b4fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="1000" height="400" fill="url(#bgGradient)"/>
  
  <!-- Top light section -->
  <rect y="0" width="1000" height="180" fill="url(#topGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="50" r="70" fill="#6366f1" opacity="0.2"/>
  <circle cx="900" cy="100" r="100" fill="#ffffff" opacity="0.15"/>
  <circle cx="150" cy="350" r="80" fill="#3b82f6" opacity="0.1"/>
  
  <!-- Logo/Icon area left side -->
  <rect x="50" y="220" width="80" height="80" rx="15" fill="#ffffff" opacity="0.9"/>
  <text x="90" y="270" font-size="28" font-weight="bold" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif">C</text>
  
  <!-- Main title -->
  <text x="200" y="120" font-size="48" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">
    ConnectWith
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="160" font-size="20" fill="#475569" font-family="Arial, sans-serif">
    JOB PORTAL WEB APPLICATION
  </text>
  
  <!-- Feature text -->
  <text x="200" y="240" font-size="16" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">
    Find Jobs | For Employers
  </text>
  <text x="200" y="265" font-size="16" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">
    Easy Apply | Track Progress
  </text>
  
  <!-- Tagline -->
  <text x="200" y="310" font-size="14" fill="#e0e7ff" font-family="Arial, sans-serif">
    One Platform. Endless Opportunities.
  </text>
  
  <!-- Small icons right side -->
  <circle cx="850" cy="240" r="20" fill="#ffffff" opacity="0.8"/>
  <text x="850" y="248" font-size="20" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif">💼</text>
  
  <circle cx="900" cy="280" r="20" fill="#ffffff" opacity="0.8"/>
  <text x="900" y="288" font-size="20" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif">🔍</text>
  
  <circle cx="950" cy="240" r="20" fill="#ffffff" opacity="0.8"/>
  <text x="950" y="248" font-size="20" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif">✈️</text>
</svg>